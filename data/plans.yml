      public_comment: { start: 2027-01, end: 2027-02 }
    notes: >-
      障害者基本法11条3項により、市町村障害者計画は障害者基本計画及び都道府県障害者計画を
      基本として策定しなければならない。e-Gov法令検索で条文（同条3項「市町村は、障害者基本計画
      及び都道府県障害者計画を基本とするとともに…当該市町村における障害者のための施策に関する
      基本的な計画…を策定しなければならない。」）を確認し、conforms_toの根拠とした。

  - id: shougai-fukushi-7
