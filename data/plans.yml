  kodomo:  { label: こども・子育て, domain: fukushi }
  iryou:   { label: 医療保険・保健事業, domain: fukushi }
  kenkou:  { label: 健康づくり・自殺対策, domain: fukushi }
  jyoui:   { label: 上位・関連行政計画, domain: sougou }
