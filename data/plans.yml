    statutory: effort
    department: 市民福祉課 地域福祉班
    notes: >-
      地域福祉計画に包含。中核機関「後見センター壱岐」は令和3年7月に社協内へ開設。
      高齢者の権利擁護（成年後見制度の利用支援）の実務は長寿支援課 地域包括支援センターが担う。
      成年後見制度の利用の促進に関する法律14条1項をe-Gov法令検索で確認したところ、国の
      「成年後見制度利用促進基本計画を勘案して…定めるよう努める」（努力義務）とあるのみで、
      都道府県計画は登場しない。

