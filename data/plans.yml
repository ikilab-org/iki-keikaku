      対象範囲が異なる別計画のため related とした（本計画の department 未確定のため部分的な
      重複所管かどうかは不明）。

  - id: akiya-taisaku
    name: 壱岐市空家等対策計画
    level: municipal
    domain: kiban
    category: jutaku
    tier: kobetsu
    status: expired
    period: { start: 2018, end: 2022 }
    adopted: 2018-03
    laws: [空家等対策の推進に関する特別措置法7条1項]
    statutory: permissive
    pdf: https://www.city.iki.nagasaki.jp/material/files/group/6/ikishiakiyatoutaisakukeikaku.pdf
    todo: >-
      所管班を分掌事務で確認する（計画書第4章2.(5)「推進体制の構築」〈PDF52ページ〉に、策定当時
      「危機管理課」を空家等担当課としている旨の記載がある。ただし現行の行政組織規則に「危機管理課」
      という課は存在せず、総務課の下に「危機管理班」があるのみで、「空家」の語自体も規則に
      登場しない。当時の組織〈危機管理課がどの部に属していたか等〉は未確認。2026年時点の特定空家等
      の措置命令〈空家法22条3項〉の問い合わせ先は建設課 建築整備班であり〈同課ページID 16113〉、
      策定当時と現在とで所管が同じか異なるかは確定できない）。計画期間（平成30～34〈令和4〉年度）
      が満了しているため、改定・次期計画の有無を確認する。市サイトに本計画の掲載ページを確認
      できていない（PDF本体のみ確認）。
    notes: >-
      平成26年11月制定の空家等対策の推進に関する特別措置法（空家法）に先立ち、平成25年3月に
      市独自の「壱岐市空き家等の適正管理に関する条例」を制定していた。空家法施行を受け、平成29年
      12月に「壱岐市空家等対策協議会設置要綱」を制定し、平成30年3月に本計画を策定した
      （計画書第1章）。計画期間は「5年間」、具体的には「平成30年度～平成34年度」（令和4年度に
      相当）とPDF本文（第1章）に明記されている。laws は空家等対策の推進に関する特別措置法7条1項
      「市町村は…空家等に関する対策についての計画（以下「空家等対策計画」という。）を定める
      ことができる」（許容規定）を根拠とした。この条項は令和5年6月改正・同年12月施行により、
      計画書策定当時の条番号「第6条」から現行の「第7条」に繰り下がっている（e-Gov法令検索、
      法令ID 426AC1000000127で現行条文を確認。計画書自体は策定当時の条番号「第6条」を引用して
      いる）。2026年8月時点で市サイトに本計画の掲載ページ・改定版を確認できていない。data/schema.md の
      tier 区分に照らすと、本計画は分野横断的な方針を定める部門別基本計画（bumon、例: 地域福祉計画）
      ではなく、対象を空家等・特定空家等・空家等の跡地に特定し、除却・利活用等の具体的な施策を
      定める計画（計画書第4章「空家等対策の推進」に「1．空家等対策の施策の体系」の章立てがある）
      であり、介護保険事業計画や障がい福祉計画（kobetsu の例）と同様に具体的な対象・目標を持つ
      性格が強いため、tier は kobetsu とした。

