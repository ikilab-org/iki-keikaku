    statutory: mandatory
    department: 市民福祉課 地域福祉班
    related: [pref-shougai-fukushi-7, shougai-keikaku-3]
    url: https://www.city.iki.nagasaki.jp/soshiki/shimin/fukushi/12605.html
    successor:
      name: 第8期障がい福祉計画・第4期障がい児福祉計画
      status: planned
      public_comment: { start: 2027-01, end: 2027-02 }
    notes: >-
      障害者総合支援法88条1項・児童福祉法33条の20第1項をe-Gov法令検索で確認したところ、いずれも
      「定めるものとする」（義務規定）。同法88条7項は「市町村障害福祉計画は、障害者基本法第十一条
      第三項に規定する市町村障害者計画、社会福祉法第百七条第一項に規定する市町村地域福祉計画その他
      の法律の規定による計画であって障害者等の福祉に関する事項を定めるものと調和が保たれたもので
      なければならない。」と定め、調和を求める相手は同じ壱岐市内の障がい者計画・地域福祉計画であり、
      都道府県計画（pref-shougai-fukushi-7）との整合は条文上求められていない
      （都道府県の意見聴取義務〈11項〉があるのみ）ため、pref-shougai-fukushi-7 は
      conforms_to ではなく related のままとした。

