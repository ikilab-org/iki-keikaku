  - id: jisedai-koki
    name: 壱岐市次世代育成支援行動計画（後期計画）
    level: municipal
    domain: fukushi
    category: kodomo
    tier: kobetsu
    status: expired
    period: { start: 2010, end: 2014 }
    laws: [次世代育成支援対策推進法8条1項]
    department: 子育て支援課
    url: https://www.city.iki.nagasaki.jp/soshiki/kodomo/machizukuri/shi_keikaku/kenkofukushi/889.html
    pdf: https://www.city.iki.nagasaki.jp/material/files/group/2/jisedaiikusei.pdf
    todo: 策定年月を確認する（計画書第1章に「平成21年度に後期計画を策定」とあるのみで、確定した年月の記載を確認できていない）
    notes: >-
      kodomo-jigyou-1（第1期子ども・子育て支援事業計画）の前身。次世代育成支援対策推進法8条1項は、
      同法が平成26年度までの時限法だった当時（本計画の策定当時）は市町村に行動計画の策定を義務づけており、
      計画書第1章にも「（国は）...平成17年度から5年を1期とした前期・後期計10年間の次世代育成対策に関する
      行動計画の策定を義務づけ」と明記されている。その後、同法の有効期限を延長する改正が行われ、
      延長後の期間分については「策定することができる」という許容規定になっている（kodomo-1 参照）。
      策定当時と現行とで義務の強さの意味が変わるため `statutory` は書かない。
      本計画（後期計画、平成22～26年度）の前に前期計画（平成17～21年度）があるが、掲載ページを確認できていない。

