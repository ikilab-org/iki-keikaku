      組織」欄に「下水道班３名」と明記されており、department の根拠とした（行政組織規則第4条の
      下水道班の分掌事務「公共下水道事業及び漁業集落排水整備事業に関すること」とも一致）。
      両PDFに、平成21年4月に水道課と下水道課が統合して水道課となり、平成23年4月に上下水道課へ
      改称した旨の記載がある。

