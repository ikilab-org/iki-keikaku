      にも存在しており、19条4項1号は地域計画が「基本構想に即する」ことを要件としている（同法令ID
      の条文本文で確認）。壱岐市の基本構想の存在を農林課の掲載ページ・サイト内検索・一般Web検索で
      探したが、該当するページ・PDFは見つからなかった（探し方は sources/POLICY.md に記録）。
      壱岐市の地域計画が基本構想にどのように即しているかは、市の一次資料からは確認できていない。
      period は、19条2項が地域計画の記載事項として計画期間を挙げておらず、19条5項も「情勢の推移
