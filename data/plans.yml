      見出し（市町村の定める農業振興地域整備計画）に市名を冠した一般的な呼称であり、壱岐市
      自身が用いる正式名称を確認したものではない。tier は当初 bumon としていたが、同じ
      農林課所管の法定個別計画である chiiki-nougyou-keikaku（地域計画、農業経営基盤強化
      促進法19条1項）・shinrin-seibi（森林整備計画、森林法10条の5第1項）がいずれも
      tier: kobetsu であり、農振法8条1項に基づく本計画も同種の法定個別計画であるため
      kobetsu に揃えた。department は、協議会規則第6条（庶務）が示すのは協議会（附属機関）
      の事務局であって、計画そのものの所管を直接裏付ける行政組織規則第3条・第4条の分掌事務
      ではないと判断し、農林課という課レベルの記載も含めて確定値とせず todo に残した
