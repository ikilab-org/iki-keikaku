      （e-Gov法令検索、法令ID 355AC0000000065、2025-04-01時点の現行条文で確認）。掲載ページ
      自身は根拠として同条8項（策定・変更時の公告義務）を挙げているが、8項は公告手続きの規定で
      あり、計画の策定自体を義務付けるのは1項。
      同法6条「農業経営基盤強化促進基本構想」（市町村が定めることができる、許容規定）は現行条文
      にも存在しており、19条4項1号は地域計画が「基本構想に即する」ことを要件としている（同法令ID
      の条文本文で確認）。壱岐市の基本構想の存在を農林課の掲載ページ・サイト内検索・一般Web検索で
      探したが、該当するページ・PDFは見つからなかった（探し方は sources/POLICY.md に記録）。
      壱岐市の地域計画が基本構想にどのように即しているかは、市の一次資料からは確認できていない。
      period は、19条2項が地域計画の記載事項として計画期間を挙げておらず、19条5項も「情勢の推移
      により必要が生じたときは、地域計画を変更するものとする」として固定の改定サイクルを定めて
      いないため、`bousai`（地域防災計画）と同様の随時修正型と判断し null とした。

